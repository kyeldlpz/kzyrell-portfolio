<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Arcade cabinet body -->
  <rect x="4" y="2" width="24" height="28" rx="2" fill="#1a1a2e"/>
  <rect x="4" y="2" width="24" height="28" rx="2" stroke="#00fff5" stroke-width="1" fill="none"/>
  
  <!-- Screen -->
  <rect x="7" y="5" width="18" height="12" rx="1" fill="#0a0a0a"/>
  <rect x="7" y="5" width="18" height="12" rx="1" stroke="#00ff00" stroke-width="0.5" fill="none"/>
  
  <!-- Screen content (pixel art) -->
  <rect x="10" y="8" width="2" height="2" fill="#00fff5"/>
  <rect x="14" y="8" width="2" height="2" fill="#ff00ff"/>
  <rect x="18" y="8" width="2" height="2" fill="#00fff5"/>
  <rect x="12" y="11" width="2" height="2" fill="#ffff00"/>
  <rect x="16" y="11" width="2" height="2" fill="#ffff00"/>
  
  <!-- Controls -->
  <circle cx="10" cy="22" r="3" fill="#16213e" stroke="#00fff5" stroke-width="0.5"/>
  <circle cx="10" cy="22" r="1" fill="#ff0040"/>
  
  <!-- Buttons -->
  <circle cx="19" cy="21" r="2" fill="#ff0040"/>
  <circle cx="24" cy="21" r="2" fill="#00ff00"/>
  <circle cx="21.5" cy="24" r="2" fill="#ffff00"/>
  
  <!-- Coin slot -->
  <rect x="13" y="26" width="6" height="2" rx="0.5" fill="#333" stroke="#666" stroke-width="0.5"/>
</svg>
